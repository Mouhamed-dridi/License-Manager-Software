<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .table-responsive {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .table thead th {
            background-color: #198754;
            color: white;
            vertical-align: middle;
        }
        .action-btn {
            min-width: 80px;
        }
        .badge-license {
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-archive-fill me-2"></i>License Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-house-door me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-question-circle me-1"></i> Guide
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col">
                <h1 class="display-6 mb-4">
                    <i class="bi bi-clipboard2-data text-success"></i> Software Licenses Dashboard
                </h1>
                
                <div class="table-responsive rounded-3">
                    <table class="table table-hover table-striped" id="licenseTable">
                        <thead class="align-middle">
                            <tr>
                                <th>Software Name</th>
                                <th>Provider</th>
                                <th>Dates</th>
                                <th>License Type</th>
                                <th>Price</th>
                                <th>Admin</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="licenseBody" class="align-middle"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load data from localStorage
        const licenses = JSON.parse(localStorage.getItem('licenses')) || [];
        const tbody = document.getElementById('licenseBody');

        // Format date for display
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Get badge color based on license type
        function getLicenseBadge(type) {
            const types = {
                'subscription': 'bg-primary',
                'perpetual': 'bg-success',
                'trial': 'bg-warning text-dark'
            };
            return types[type] || 'bg-secondary';
        }

        function renderTable() {
            tbody.innerHTML = licenses.map(license => `
                <tr>
                    <td><strong>${license.softwareName || 'N/A'}</strong></td>
                    <td>${license.provider || 'N/A'}</td>
                    <td>
                        <div><small class="text-muted">Start:</small> ${formatDate(license.startDate)}</div>
                        <div><small class="text-muted">End:</small> ${formatDate(license.endDate)}</div>
                    </td>
                    <td>
                        <span class="badge rounded-pill ${getLicenseBadge(license.licenseType)} badge-license">
                            ${license.licenseType || 'N/A'}
                        </span>
                    </td>
                    <td class="fw-bold">$${license.price || '0.00'}</td>
                    <td>
                        <span class="badge bg-light text-dark">
                            ${license.admin || 'Unassigned'}
                        </span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-sm btn-outline-primary action-btn" title="View">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-success action-btn" title="Edit">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger action-btn" 
                                    onclick="deleteLicense(${license.id})" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function deleteLicense(id) {
            if (confirm('Are you sure you want to delete this license?')) {
                const index = licenses.findIndex(license => license.id === id);
                if (index !== -1) {
                    licenses.splice(index, 1);
                    localStorage.setItem('licenses', JSON.stringify(licenses));
                    renderTable();
                }
            }
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
