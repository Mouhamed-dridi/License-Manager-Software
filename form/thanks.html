<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    /* Thank You Card */
    .thank-you-card {
      width: 90%;
      max-width: 500px;
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transform: translateY(0);
      animation: floatUp 0.5s ease-out;
    }
    
    /* Checkmark Icon */
    .checkmark {
      display: inline-block;
      width: 80px;
      height: 80px;
      background: #4CAF50;
      border-radius: 50%;
      color: white;
      font-size: 50px;
      line-height: 80px;
      margin-bottom: 25px;
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }
    
    /* Text Styles */
    h1 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 28px;
    }
    
    p {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    /* Button Styles */
    .return-btn {
      display: inline-block;
      background: #4CAF50;
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      border: 2px solid #4CAF50;
    }
    
    .return-btn:hover {
      background: transparent;
      color: #4CAF50;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(76, 175, 80, 0.2);
    }
    
    /* Animation */
    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      .thank-you-card {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .checkmark {
        width: 70px;
        height: 70px;
        line-height: 70px;
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="thank-you-card">
    <div class="checkmark">✓</div>
    <h1>Thank You!</h1>
    <p>
        We’ve successfully received and stored all your form data in our secure database. Your information is now safely recorded and can be accessed anytime for future reference.
    </p>
    <a href="/databases/dashboard.html" class="return-btn">check dashbaord</a>
  </div>
</body>
</html>
