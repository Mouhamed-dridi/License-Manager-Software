<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>License Dashboard</title>

</head>
<body>
    <h1>Software Licenses Dashboard</h1>
    <table id="licenseTable">
        <thead>
            <tr>
                <th>Software Name</th>
                <th>Provider</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>License Type</th>
                <th>Price</th>
                <th>Admin</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="licenseBody"></tbody>
    </table>

    <script>
        // Load data from localStorage
        const licenses = JSON.parse(localStorage.getItem('licenses')) || [];
        const tbody = document.getElementById('licenseBody');

        function renderTable() {
            tbody.innerHTML = licenses.map(license => `
                <tr>
                    <td>${license.softwareName}</td>
                    <td>${license.provider}</td>
                    <td>${license.startDate}</td>
                    <td>${license.endDate}</td>
                    <td>${license.licenseType}</td>
                    <td>$${license.price}</td>
                    <td>${license.admin}</td>
                    <td class="actions">
                        <button onclick="deleteLicense(${license.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteLicense(id) {
            const index = licenses.findIndex(license => license.id === id);
            if (index !== -1) {
                licenses.splice(index, 1);
                localStorage.setItem('licenses', JSON.stringify(licenses));
                renderTable();
            }
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
